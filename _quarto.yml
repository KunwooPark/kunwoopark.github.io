project:
  type: website
  output-dir: docs
  post-render:
    - scripts/sync-cv.py
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - cv.qmd
    - cv-pdf.qmd
    - 404.qmd
  resources:
    - files/
    - images/
    - .nojekyll

website:
  title: "Kunwoo Park"
  site-url: https://kunwoopark.github.io/
  description: "Kunwoo Park is a Ph.D. student at Seoul National University researching integrated, disordered, and topological photonics for AI computing with light."
  open-graph: true
  image: images/profile.jpg
  image-alt: "Portrait of Kunwoo Park"
  favicon: park.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: cv.qmd
        text: CV

format:
  html:
    theme: litera
    css: styles.css
    toc: false
    link-external-newwindow: true

execute:
  freeze: auto
